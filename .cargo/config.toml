# Use a single target dir at repo root so `cargo test --manifest-path src-tauri\Cargo.toml`
# and Tauri builds share the same artifacts. No need to set CARGO_TARGET_DIR.
[build]
target-dir = ".cargo-target"

# NOTE: LIBCLANG_PATH / CMAKE are intentionally NOT set here. Cargo's [env]
# applies on every OS, so hardcoding Windows paths broke Linux/macOS builds
# (they'd try to run C:\...\cmake.exe). These are now set per-OS:
#   - CI: in the release workflow (Windows step sets the C:\ paths; Linux/macOS
#     use system cmake/libclang on PATH).
#   - Local Windows dev: ensure LLVM\bin and CMake\bin are on PATH, or set
#     LIBCLANG_PATH / CMAKE as user environment variables.
