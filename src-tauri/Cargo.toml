[package]
name = "nexusvoice"
version = "1.16.0"
edition = "2021"

[features]
# Build the Vulkan compute backend. Requires the Vulkan SDK at build time, so
# release builds enable it and local dev runs CPU-only without it.
gpu = ["transcribe-cpp/vulkan"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-log = { version = "2", features = ["colored"] }
log = "0.4"
opener = "0.8"
strsim = "0.11"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "chrono", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
argon2 = { version = "0.5", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = "0.6"
enigo = "0.6"
cpal = "0.18"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"

# transcribe.cpp wrapper: GGUF speech-to-text across ~16 model families, with
# both single-shot (`Session::run`) and native streaming (`Session::stream`).
# `dynamic-backends` loads Vulkan/CUDA at runtime instead of link time, so one
# binary covers every accelerator — replacing the standard/CUDA build split.
transcribe-cpp = { version = "0.2", default-features = false }
rubato = "5"
rphonetic = "3.0.6"
rustfft = "6.4.1"
tokio-util = "0.7.19"
earshot = "1.2.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi"] }
# GPU backends are dlopen'd at runtime, so one binary serves every accelerator.
# The Vulkan module is built only under the `gpu` feature (release builds), which
# needs the Vulkan SDK present; without it the CPU variants still ship.
transcribe-cpp = { version = "0.2", features = ["dynamic-backends"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
transcribe-cpp = { version = "0.2", features = ["dynamic-backends"] }
# Wayland refuses global key grabs, so dictation is also triggerable by signal.
signal-hook = "0.3"
# xdg-desktop-portal: the sanctioned way to type on Wayland, no helper tool.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[profile.release]
# Must stay "unwind" — the recording path's catch_unwind guards are no-ops under "abort".
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
