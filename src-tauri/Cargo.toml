[package]
name = "nexusvoice"
version = "1.10.0-4"
edition = "2021"

# Parakeet GPU accelerators. Enabled per build variant in CI; selecting one both
# turns on the transcribe-rs ort EP and lets the engine request that accelerator
# explicitly (transcribe-rs's Auto excludes DirectML, so it must be explicit).
[features]
parakeet-directml = ["transcribe-rs/ort-directml"]
parakeet-cuda = ["transcribe-rs/ort-cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-log = { version = "2", features = ["colored"] }
log = "0.4"
opener = "0.8"
strsim = "0.11"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
argon2 = { version = "0.5", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = "0.6"
enigo = "0.2"
cpal = "0.17"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
reqwest = { version = "0.13", features = ["blocking", "stream"] }
futures-util = "0.3"
nnnoiseless = "0.5.2"
voice_activity_detector = "0.2.1"

# log_backend routes whisper.cpp/GGML's stderr spam through `log` so our level
# filter can mute it (see install_logging_hooks in main.rs).
whisper-rs = { version = "0.16", features = ["log_backend"] }
# Parakeet engine (ONNX Runtime). Pinned to 0.3.1 so its `ort` (rc.10) matches
# the version voice_activity_detector already pins — newer transcribe-rs wants a
# different exact `ort` and conflicts. GPU accelerator features (ort-directml /
# ort-cuda) are injected per build variant in CI; base is CPU.
transcribe-rs = { version = "=0.3.1", features = ["onnx"] }
rubato = "0.16.2"
rphonetic = "3.0.6"
rustfft = "6.4.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
