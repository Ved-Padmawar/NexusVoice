name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# NOTE: macOS is intentionally NOT built/released here yet. The macOS code paths
# (Metal GPU probe, Cmd paste modifier, platform-gated pill logic) are complete
# in the tree, but shipping a macOS build requires an Apple Developer ID for
# code signing + notarization (without it Gatekeeper blocks the app). When that
# account exists, add one matrix line — { os: macos-14, variant: metal } — plus
# an NSMicrophoneUsageDescription Info.plist entry and signing secrets.

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One build per OS: backend modules are loaded at runtime, so a single
          # binary covers Vulkan and every CPU variant.
          - { os: windows-latest, variant: standard }
          - { os: ubuntu-22.04,   variant: standard }

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Windows only: build into a short path (C:\b) to avoid MSVC/CMake path-length
      # limits. Linux uses the repo's configured .cargo-target dir — the
      # artifact-collection and upload steps key their paths off this same OS split.
      - name: Set short Cargo target dir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=C:\b" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # bindgen (libclang) and cmake-rs need these located. LLVM and CMake are
      # preinstalled at these paths on the Windows runner.
      - name: Set libclang / cmake paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          $cmake = "C:\Program Files\CMake\bin\cmake.exe"
          if (-not (Test-Path "$llvm\libclang.dll")) { throw "libclang.dll not found at $llvm" }
          if (-not (Test-Path $cmake)) { throw "cmake not found at $cmake" }
          echo "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CMAKE=$cmake"        | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ── Linux system dependencies ────────────────────────────────────────────
      # Built on Ubuntu 22.04 — the oldest base that ships WebKitGTK 4.1, which
      # keeps the glibc floor low enough to run on older distros.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxdo-dev \
            patchelf \
            libfuse2 \
            file \
            build-essential \
            libssl-dev \
            clang \
            libclang-dev \
            llvm-dev \
            cmake \
            pkg-config

      # bindgen can't always auto-discover libclang on the runner, so point
      # LIBCLANG_PATH at the dir that actually holds libclang.so.*.
      - name: Set LIBCLANG_PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          LIBCLANG_DIR=$(dirname "$(find /usr/lib /usr/lib64 -name 'libclang.so*' -print -quit)")
          echo "Found libclang in: $LIBCLANG_DIR"
          echo "LIBCLANG_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV"

      # Needed to compile the Vulkan backend module (the `gpu` feature). Local
      # dev builds omit the feature and run CPU-only without the SDK.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          $installer = "$env:TEMP\vulkan-sdk.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          $sdkPath = (Get-ChildItem "C:\VulkanSDK" | Sort-Object Name -Descending | Select-Object -First 1).FullName
          echo "VULKAN_SDK=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$sdkPath\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # glslc (shaderc) isn't in Ubuntu 22.04's own repos, so use LunarG's.
      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            http://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          glslc --version

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      # Gate the release on the same checks run locally. A tag whose code fails
      # type-check, lint, tests, formatting or Clippy must not publish.
      - name: Frontend checks (type, lint, unit tests)
        run: |
          bun run build
          bun run lint
          bun run test

      # Prebuilt binary, so this costs seconds rather than a source build.
      - name: Setup nextest
        uses: taiki-e/install-action@nextest

      # Release profile so the artifacts match what tauri-action builds with —
      # the build then reuses them instead of recompiling the dependency tree.
      - name: Backend checks (format, Clippy, tests)
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --release -- -W clippy::pedantic -D warnings
          cargo nextest run --release

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json

      - name: Cache Rust deps
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          cache-targets: false

      # Tauri's mirrored linuxdeploy bundles a `strip` too old to process
      # libraries built with current toolchains, which is the "failed to run
      # linuxdeploy" that previously kept AppImage out of this release. Putting
      # a current upstream build in Tauri's tool cache is the fix.
      # `--appimage-extract-and-run` avoids needing FUSE on the runner.
      - name: Install linuxdeploy
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          TOOLS="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TOOLS"
          curl -fsSL --retry 3 -o "$TOOLS/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x "$TOOLS/linuxdeploy-x86_64.AppImage"
          "$TOOLS/linuxdeploy-x86_64.AppImage" --appimage-extract-and-run --version

      # Every CPU variant is compiled and selected at runtime, so the binary
      # never inherits the runner's ISA and fault on older CPUs (0xc000001d).
      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build -- --features gpu

      # deb and rpm cover package-manager installs; the AppImage is additionally
      # the only Linux bundle Tauri emits an updater artifact for, so it is what
      # makes auto-update work at all on Linux.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The Vulkan loader and Wayland client must come from the user's
          # graphics stack; bundling the runner's copies shadows a newer Mesa
          # or ICD and breaks GPU inference on rolling-release distros.
          LINUXDEPLOY_EXCLUDED_LIBRARIES: "libvulkan.so*;libwayland-client.so*"
          # appimagetool writes this as X-AppImage-Version, which desktop
          # integration tools (Gear Lever) read to track installed versions.
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          export LINUXDEPLOY_OUTPUT_VERSION="${GITHUB_REF_NAME#v}"
          bun run tauri build --bundles deb,rpm,appimage -- --features gpu

      # Collect the updater artifact each OS produces: NSIS on Windows, the
      # AppImage on Linux. deb and rpm are not updater targets — those users
      # update through their package manager.
      - name: Collect updater artifact
        shell: python
        env:
          UPDATER_PLATFORM: ${{ runner.os == 'Windows' && 'windows-x86_64' || 'linux-x86_64' }}
          BUNDLE_GLOB: ${{ runner.os == 'Windows' && 'C:/b/release/bundle/nsis/*.exe' || '.cargo-target/release/bundle/appimage/*.AppImage' }}
        run: |
          import glob, os, pathlib

          # `*.AppImage` also matches the `.sig` sitting beside it, so the
          # signature files are filtered out before picking the bundle.
          matches = sorted(
            m for m in glob.glob(os.environ["BUNDLE_GLOB"]) if not m.endswith(".sig")
          )
          if not matches:
            raise SystemExit(f"no updater bundle matched {os.environ['BUNDLE_GLOB']}")

          bundle = pathlib.Path(matches[0])
          pathlib.Path("updater-sig.txt").write_text(
            pathlib.Path(f"{bundle}.sig").read_text().strip()
          )
          pathlib.Path("updater-name.txt").write_text(bundle.name)
          pathlib.Path("updater-platform.txt").write_text(os.environ["UPDATER_PLATFORM"])
          print(f"updater artifact: {bundle.name} ({os.environ['UPDATER_PLATFORM']})")

      - name: Upload updater signature
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sig-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            updater-sig.txt
            updater-name.txt
            updater-platform.txt

      - name: Upload release artifacts (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            C:/b/release/bundle/nsis/*.exe
            C:/b/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts (Linux)
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            .cargo-target/release/bundle/deb/*.deb
            .cargo-target/release/bundle/rpm/*.rpm
            .cargo-target/release/bundle/appimage/*.AppImage
            .cargo-target/release/bundle/appimage/*.AppImage.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The CUDA pack the app downloads on NVIDIA GPUs, built from the locked transcribe-cpp.
  cuda-pack:
    name: CUDA pack (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x86_64 }
          - { os: ubuntu-22.04,   platform: linux-x86_64 }

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # CUDA 13 runs on NVIDIA driver 580+; older drivers fall back to Vulkan.
      - name: Install CUDA toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.3.1"
          method: network
          sub-packages: '["nvcc", "crt", "nvvm", "cudart", "cublas", "cublas_dev", "thrust"]'

      - name: Install CUDA toolkit (Linux)
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.3.1"
          method: network
          sub-packages: '["nvcc", "crt", "cudart-dev", "cccl", "driver-dev"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'

      # nvcc needs cl.exe; Ninja avoids CUDA's Visual Studio integration.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with Ninja (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Write the CUDA build crate
        shell: python
        run: |
          import os, pathlib, re

          lock = pathlib.Path("src-tauri/Cargo.lock").read_text()
          locked = lambda name: re.search(rf'name = "{name}"\nversion = "([^"]+)"', lock).group(1)
          crate = pathlib.Path("cuda-build")
          crate.mkdir()
          (crate / "lib.rs").write_text("")
          (crate / "Cargo.toml").write_text(f'''[package]
          name = "cuda-build"
          version = "0.0.0"
          edition = "2021"
          [lib]
          path = "lib.rs"
          [dependencies]
          transcribe-cpp-sys = {{ version = "={locked("transcribe-cpp-sys")}", default-features = false, features = ["cuda", "dynamic-backends"] }}
          ''')
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"ENGINE_VERSION={locked('transcribe-cpp')}\n")

      # The runner's default shell: Git Bash would put its own link.exe ahead of MSVC's.
      - name: Build the CUDA module
        env:
          # Consumer GPUs: RTX 20 / GTX 16, RTX 30, RTX 40, RTX 50.
          TRANSCRIBE_CMAKE_ARGS: "-DCMAKE_CUDA_ARCHITECTURES=75;86;89;120"
        run: cargo build --release --manifest-path cuda-build/Cargo.toml --target-dir cuda-build/target

      - name: Package the CUDA pack
        shell: python
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          import glob, gzip, hashlib, json, os, pathlib, re, shutil

          platform = os.environ["PLATFORM"]
          windows = platform.startswith("windows")
          cuda = pathlib.Path(os.environ.get("CUDA_PATH", "/usr/local/cuda"))
          lib_dirs = [cuda / "bin" / "x64", cuda / "bin"] if windows else [cuda / "lib64", cuda / "targets/x86_64-linux/lib"]

          def runtime(stem):
              # Windows: cudart64_13.dll. Linux: the SONAME, libcudart.so.13.
              pattern = rf"^{stem}64_\d+\.dll$" if windows else rf"^lib{stem}\.so\.\d+$"
              for d in lib_dirs:
                  for name in sorted(os.listdir(d)) if d.is_dir() else []:
                      if re.match(pattern, name):
                          return d / name
              raise SystemExit(f"{stem} not found under {lib_dirs}")

          module_name = "ggml-cuda.dll" if windows else "libggml-cuda.so"
          modules = sorted(
              glob.glob(f"cuda-build/target/release/build/transcribe-cpp-sys-*/out/**/{module_name}", recursive=True),
              key=len,
          )
          if not modules:
              raise SystemExit(f"{module_name} was not built")

          # Load order: the runtime first, the ggml module last.
          sources = [runtime("cudart"), runtime("cublasLt"), runtime("cublas"), pathlib.Path(modules[0])]
          out = pathlib.Path("cuda-pack")
          out.mkdir()
          files = []
          for src in sources:
              asset = f"cuda-{platform}-{src.name}.gz"
              with open(src, "rb") as raw, gzip.open(out / asset, "wb", compresslevel=9) as packed:
                  shutil.copyfileobj(raw, packed)
              files.append({
                  "name": src.name,
                  "asset": asset,
                  "sha256": hashlib.sha256(src.read_bytes()).hexdigest(),
                  "size": (out / asset).stat().st_size,
              })
              print(f"{src.name}: {files[-1]['size'] // 1048576} MB packed")

          manifest = {"engine": os.environ["ENGINE_VERSION"], "files": files}
          (out / f"cuda-pack-{platform}.json").write_text(json.dumps(manifest, indent=2))

      - name: Upload the CUDA pack
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: cuda-pack/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-update:
    name: Publish latest.json
    needs: build
    runs-on: ubuntu-latest
    steps:
      # `path` keeps each artifact in a directory named after it; without it a
      # lone artifact is flattened into the workspace root.
      - name: Download signatures
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: sig-*
          path: sigs

      - name: Generate latest.json
        shell: python
        run: |
          import json, os, datetime, pathlib

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          pub_date = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")

          # Found by name because download-artifact nests several artifacts but
          # unpacks a lone one straight into `path`.
          sigs = sorted(pathlib.Path("sigs").rglob("updater-sig.txt"))
          print("found:", [str(p) for p in sigs])

          platforms = {}
          for sig_path in sigs:
            entry = sig_path.parent
            platform = (entry / "updater-platform.txt").read_text().strip()
            name = (entry / "updater-name.txt").read_text().strip()
            platforms[platform] = {
              "signature": sig_path.read_text().strip(),
              "url": f"{base}/{name}",
            }

          # An empty map ships a manifest every client rejects.
          if not platforms:
            raise SystemExit("no updater signatures found; latest.json would be empty")

          payload = {
            "version": version,
            "notes": f"NexusVoice {version}",
            "pub_date": pub_date,
            "platforms": platforms,
          }
          pathlib.Path("latest.json").write_text(json.dumps(payload, indent=2))
          print(json.dumps(payload, indent=2))

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
