[package]
name = "nexusvoice"
version = "1.18.1"
edition = "2021"
license = "MIT"

[features]
# Vulkan backend; needs the Vulkan SDK, so only release builds enable it.
gpu = ["transcribe-cpp/vulkan"]

# The exe icon; GPUI loads its windows' icon from resource 1.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
# GPUI and its components; icons are our own Phosphor set.
gpui-kit = { version = "0.8", default-features = false, features = ["component"] }
rust-embed = "8"
log = "0.4"
async-channel = "2"
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png"] }
# Desktop integration (formerly Tauri plugins).
arboard = { version = "3", features = ["wayland-data-control"] }
global-hotkey = "0.9"
interprocess = "2"
tray-icon = "0.26"
# Self-update: version compare and minisign verification.
semver = "1"
minisign-verify = "0.3"
base64 = "0.22"
opener = "0.9"
# The pill's native handle, to place it without taking focus.
raw-window-handle = "0.6"
strsim = "0.11"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "chrono", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.6"
cpal = "0.18"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
# The on-demand CUDA pack: unpack, verify, preload.
flate2 = "1"
sha2 = "0.10"
libloading = "0.8"

# GGUF speech-to-text, single-shot and streaming.
transcribe-cpp = { version = "0.3", default-features = false }
rubato = "5"
rphonetic = "4"
rustfft = "6.4.1"
tokio-util = "0.7.19"
earshot = "1.2.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Backends are loaded at runtime, so one binary serves every accelerator.
transcribe-cpp = { version = "0.3", features = ["dynamic-backends"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
transcribe-cpp = { version = "0.3", features = ["dynamic-backends"] }
# The Linux tray icon needs a GTK main loop.
gtk = "0.18"
# Wayland has no global hotkeys; dictation is also triggered by signal.
signal-hook = "0.4"
# Typing on Wayland (portal) and placing the pill on X11.
x11rb = "0.13"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "remote_desktop", "screencast"] }

[dev-dependencies]
tempfile = "3"
serial_test = "4"
# Signs updater test fixtures.
minisign = "0.10"

# Unoptimized GPUI can't hold a frame rate, so dev builds optimize dependencies.
[profile.dev.package."*"]
opt-level = 2

# Skips GPUI's DirectX debug layer, which errors without the Graphics Tools.
[profile.dev.package.gpui-pre-windows]
debug-assertions = false

[profile.release]
# The recording path relies on catch_unwind.
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Installers, built in CI by `cargo packager`.
[package.metadata.packager]
product-name = "NexusVoice"
identifier = "com.nexusvoice.app"
description = "Local, private voice dictation"
publisher = "Ved Padmawar"
category = "Productivity"
binaries = [{ path = "nexusvoice", main = true }]
icons = [
    "packaging/icons/32x32.png",
    "packaging/icons/128x128.png",
    "packaging/icons/128x128@2x.png",
    "packaging/icons/icon.ico",
    "packaging/icons/icon.icns",
]
# transcribe.cpp and its backends, staged by build.rs.
resources = [{ src = "transcribe-libs/*", target = "." }]

[package.metadata.packager.deb]
depends = ["libxdo3", "libasound2", "libblas3", "liblapack3", "libgomp1", "libxkbcommon-x11-0", "libayatana-appindicator3-1"]

[package.metadata.packager.appimage]
# Must come from the user's graphics stack.
excluded-libs = ["libvulkan.so*", "libwayland-client.so*"]

[package.metadata.packager.nsis]
installer-icon = "packaging/icons/icon.ico"
install-mode = "currentUser"

# Built by `cargo generate-rpm`.
[package.metadata.generate-rpm]
name = "nexusvoice"
summary = "Local, private voice dictation"
assets = [
    { source = "target/release/nexusvoice", dest = "/usr/bin/nexusvoice", mode = "755" },
    { source = "transcribe-libs/*", dest = "/usr/lib/nexusvoice/", mode = "755" },
    { source = "packaging/linux/nexusvoice.desktop", dest = "/usr/share/applications/nexusvoice.desktop", mode = "644" },
    { source = "packaging/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/nexusvoice.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
xdotool = "*"
alsa-lib = "*"
blas = "*"
lapack = "*"
libgomp = "*"
libxkbcommon-x11 = "*"
libayatana-appindicator-gtk3 = "*"
